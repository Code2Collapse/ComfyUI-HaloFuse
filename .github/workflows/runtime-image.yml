name: Runtime image

# Packaging note (owner decision 2026-11-20): in the published repo Code2Collapse/ComfyUI-HaloFuse this runtime lives
# under runtime/ and workflows must sit at the repository root. When moving: put this file at the root
# .github/workflows/, set RUNTIME_DIR to "runtime" below, and add `paths: ["runtime/**", ".github/workflows/**"]` filters to push/pull_request.
on:
  push:
    branches: [main]
    paths: ["runtime/**", ".github/workflows/**"]
  pull_request:
    paths: ["runtime/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Catalog profile (catalog/profiles.json)"
        default: default
      push:
        description: "Push the image (needs the repository variable IMAGE_REPOSITORY)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}-${{ inputs.profile || 'default' }}
  cancel-in-progress: true

env:
  RUNTIME_DIR: "runtime"
  PROFILE: ${{ inputs.profile || 'default' }}
  # Registry namespace is an owner decision (D-4): unset = build and test only, never push.
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Test tools (pinned)
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Catalog valid
        run: cd "$RUNTIME_DIR" && python scripts/hf_catalog.py validate && python scripts/hf_catalog.py summary
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ env.RUNTIME_DIR }}/Dockerfile
          failure-threshold: error

  image:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The CUDA base image is large; reclaim ~25 GB from preinstalled SDKs.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Decide whether to push
        id: plan
        run: |
          if [ -n "$IMAGE_REPOSITORY" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.push }}" = "true" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Image is built and tested but not pushed (no IMAGE_REPOSITORY variable or not a main push)."
          fi
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_REPOSITORY && format('{0}/{1}', env.IMAGE_REGISTRY, env.IMAGE_REPOSITORY) || 'halofuse-runtime' }}
          tags: |
            type=raw,value=${{ env.PROFILE }}-latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=${{ env.PROFILE }}-sha-

      # C-5 snapshot first: same cache, so the image build below reuses every layer.
      - name: Node snapshot (C-5)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.RUNTIME_DIR }}
          file: ${{ env.RUNTIME_DIR }}/Dockerfile
          target: snapshot-artifact
          platforms: linux/amd64
          build-args: PROFILE=${{ env.PROFILE }}
          outputs: type=local,dest=out/snapshot
          cache-from: type=gha,scope=runtime-${{ env.PROFILE }}
          cache-to: type=gha,scope=runtime-${{ env.PROFILE }},mode=max

      - name: Build (and push when configured)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.RUNTIME_DIR }}
          file: ${{ env.RUNTIME_DIR }}/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: PROFILE=${{ env.PROFILE }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime-${{ env.PROFILE }}

      - name: Record build duration (section 10 metric 1)
        if: always()
        run: |
          secs=$(( $(date +%s) - ${{ steps.plan.outputs.start }} ))
          python3 "$RUNTIME_DIR/scripts/measure.py" record --out out/measurement.json --profile "$PROFILE" \
            --host-label "github-hosted ubuntu-24.04" --metric "build_duration=$secs" \
            --source "CI run ${{ github.run_id }}: snapshot + image build wall time (cache state in the log)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-${{ env.PROFILE }}-${{ github.sha }}
          path: |
            out/snapshot/node_snapshot.json
            out/measurement.json
          if-no-files-found: warn
