name: Runtime image

# The runtime lives under runtime/ of Code2Collapse/ComfyUI-HaloFuse; this workflow sits at the repository root.
on:
  push:
    branches: [main]
    paths: ["runtime/**", ".github/workflows/**"]
  pull_request:
    paths: ["runtime/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Catalog profile (catalog/profiles.json)"
        default: default
      attention:
        description: "Attention layer: none or sage (experimental)"
        default: none
      push:
        description: "Push the image (needs the repository variable IMAGE_REPOSITORY)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}-${{ inputs.profile || 'default' }}-${{ inputs.attention || 'none' }}
  cancel-in-progress: true

env:
  RUNTIME_DIR: "runtime"
  PROFILE: ${{ inputs.profile || 'default' }}
  ATTENTION: ${{ inputs.attention || 'none' }}
  # Registry namespace is an owner decision (D-4): unset = build and test only, never push.
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Test tools (pinned)
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Catalog valid
        run: cd "$RUNTIME_DIR" && python scripts/hf_catalog.py validate && python scripts/hf_catalog.py summary
      - name: extra_nodes.txt valid (offline)
        run: cd "$RUNTIME_DIR" && python scripts/install_nodes.py check-extras --catalog-dir catalog
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ env.RUNTIME_DIR }}/Dockerfile
          failure-threshold: error

  image:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Measured: the cleanup costs 142-145 s per run. Run it only when the disk is actually short (the base image is
      # 5.1 GiB compressed; a build plus the smoke stage needs far less than 60 GB).
      - name: Free runner disk space (only when needed)
        run: |
          avail=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          echo "available before: ${avail} GB"
          if [ "${avail}" -lt 60 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
          else
            echo "enough space, cleanup skipped"
          fi
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Plan (push, flavour, caches)
        id: plan
        run: |
          case "$ATTENTION" in none) flavour="$PROFILE" ;; sage) flavour="$PROFILE-sage" ;;
            *) echo "unknown attention '$ATTENTION' (none or sage)"; exit 1 ;; esac
          echo "flavour=$flavour" >> "$GITHUB_OUTPUT"
          gha="type=gha,scope=runtime-$flavour"
          if [ -n "$IMAGE_REPOSITORY" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.push }}" = "true" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            reg="type=registry,ref=$IMAGE_REGISTRY/$IMAGE_REPOSITORY:buildcache-$flavour"
            # Registry cache: no 10 GB cap (the GHA cache has one) and its blobs dedupe with the pushed image.
            echo "cache_to=$reg,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Image is built and smoke-tested but not pushed (no IMAGE_REPOSITORY variable or not a main push)."
            reg=""
            echo "cache_to=$gha,mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "cache_from<<EOF"
            [ -n "$reg" ] && echo "$reg"
            echo "$gha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Before the first build: the registry cache is read and written with these credentials.
      - name: Log in to the registry
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_REPOSITORY && format('{0}/{1}', env.IMAGE_REGISTRY, env.IMAGE_REPOSITORY) || 'halofuse-runtime' }}
          tags: |
            type=raw,value=${{ steps.plan.outputs.flavour }}-latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=${{ steps.plan.outputs.flavour }}-sha-

      # 1) Must not crash: builds the runtime image and runs the smoke stage (real tini + runner, CPU, no network).
      #    A crash fails the job here, before anything is pushed. This is the only build that executes layers; the
      #    two builds below reuse this builder's local cache (measured before this change: a separate snapshot build
      #    that only resolved remote cache made the push build re-run compileall (176.4 s) and the snapshot (87.0 s)).
      - name: Build + smoke test
        id: smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.RUNTIME_DIR }}
          file: ${{ env.RUNTIME_DIR }}/Dockerfile
          target: smoke-artifact
          platforms: linux/amd64
          build-args: |
            PROFILE=${{ env.PROFILE }}
            ATTENTION=${{ env.ATTENTION }}
          outputs: type=local,dest=out/smoke
          cache-from: ${{ steps.plan.outputs.cache_from }}
          cache-to: ${{ steps.plan.outputs.cache_to }}

      - name: Smoke result
        if: always()
        run: |
          echo "smoke done after $(( $(date +%s) - ${{ steps.plan.outputs.start }} )) s"
          [ -f out/smoke/smoke_report.json ] && cat out/smoke/smoke_report.json || echo "no smoke report"
          echo "T_SMOKE=$(date +%s)" >> "$GITHUB_ENV"

      # 2) C-5 snapshot (local cache hit).
      - name: Node snapshot (C-5)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.RUNTIME_DIR }}
          file: ${{ env.RUNTIME_DIR }}/Dockerfile
          target: snapshot-artifact
          platforms: linux/amd64
          build-args: |
            PROFILE=${{ env.PROFILE }}
            ATTENTION=${{ env.ATTENTION }}
          outputs: type=local,dest=out/snapshot
          cache-from: ${{ steps.plan.outputs.cache_from }}

      # 3) The image (local cache hit; only the push itself costs time).
      - name: Push (when configured)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.RUNTIME_DIR }}
          file: ${{ env.RUNTIME_DIR }}/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: |
            PROFILE=${{ env.PROFILE }}
            ATTENTION=${{ env.ATTENTION }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.plan.outputs.cache_from }}

      - name: Record build duration and smoke timings (section 10)
        if: always()
        run: |
          now=$(date +%s)
          secs=$(( now - ${{ steps.plan.outputs.start }} ))
          echo "total ${secs} s; snapshot + push after smoke: $(( now - ${T_SMOKE:-$now} )) s"
          python3 "$RUNTIME_DIR/scripts/measure.py" record --out out/measurement.json --profile "${{ steps.plan.outputs.flavour }}" \
            --host-label "github-hosted ubuntu-24.04" --metric "build_duration=$secs" \
            --source "CI run ${{ github.run_id }}: build + smoke + snapshot + push wall time (cache state in the log)"
          if [ -f out/smoke/smoke_report.json ]; then
            ready=$(python3 -c "import json;print(json.load(open('out/smoke/smoke_report.json'))['phases'].get('comfy_start',''))")
            if [ -n "$ready" ]; then
              python3 "$RUNTIME_DIR/scripts/measure.py" record --out out/measurement.json --metric "api_ready=$ready" \
                --source "smoke stage, CPU only, no network, inside the image build (not a GPU node)"
            fi
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-${{ steps.plan.outputs.flavour }}-${{ github.sha }}
          path: |
            out/snapshot/node_snapshot.json
            out/smoke/smoke_report.json
            out/measurement.json
          if-no-files-found: warn
